name: Publish v1.3.2 source release (one-time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.3.2.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'stephdust/my-modbus-rtu-ip-gateway'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check version and release notes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('components/modbus_gateway/manifest.json').read_text())
          assert manifest['version'] == '1.3.2', manifest['version']
          assert Path('docs/RELEASE_NOTES_v1.3.2.md').exists()
          PY
      - name: Publish v1.3.2 (idempotent)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.2 >/dev/null 2>&1; then
            echo 'Release v1.3.2 already exists; nothing to publish.'
          else
            gh release create v1.3.2 \
              --target "$GITHUB_SHA" \
              --title 'v1.3.2 — Background Modbus TCP cache refresh' \
              --notes-file docs/RELEASE_NOTES_v1.3.2.md \
              --latest
          fi
